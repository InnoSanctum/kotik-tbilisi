<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title and description are replaced per pet by assets/pet.js. -->
    <title>Подопечный | Помощь животным в Тбилиси</title>
    <meta name="description" content="История подопечного, галерея, документы из клиники и контакты куратора.">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="alternate icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <meta name="theme-color" content="#4f46e5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+Georgian:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <a class="skip-link" href="#main">К содержанию</a>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-paw" aria-hidden="true"></i>
                <span data-i18n="brandShort">Помощь животным</span>
            </a>
            <nav class="site-nav">
                <a href="index.html#pets" data-i18n="navPets">Питомцы</a>
                <a href="index.html#about" data-i18n="navAbout">О проекте</a>
                <a href="index.html#contacts" data-i18n="navContacts">Контакты</a>
            </nav>
            <div class="lang-switcher" role="group" aria-label="Language">
                <button type="button" class="lang-btn" data-lang="ru">RU</button>
                <button type="button" class="lang-btn" data-lang="en">EN</button>
                <button type="button" class="lang-btn" data-lang="ka">KA</button>
            </div>
        </div>
    </header>

    <div id="site-banner" hidden></div>

    <main id="main">
        <a class="back-link" href="index.html">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            <span data-i18n="backToList">Ко всем подопечным</span>
        </a>

        <!-- Shown only when ?slug= matches nothing. -->
        <div id="pet-missing" hidden></div>

        <article id="pet-article" hidden>
            <!-- Left column: gallery + donate. Right column: identity + story. -->
            <div class="detail-grid">
                <div class="detail-media">
                    <div id="pet-gallery" class="gallery-card" tabindex="0"></div>
                    <aside id="pet-donate" class="donate-box"></aside>
                </div>

                <div class="detail-main">
                    <div class="info-card">
                        <div id="pet-badges" class="badge-row"></div>
                        <h1 id="pet-name"></h1>
                        <p id="pet-subtitle" class="subtitle"></p>
                        <div id="pet-tags" class="tags"></div>
                    </div>

                    <section id="pet-story" class="detail-section"></section>
                </div>
            </div>

            <!-- Full page width from here on. -->
            <section id="pet-care" class="detail-section card-section"></section>
            <section id="pet-docs" class="detail-section card-section"></section>
            <section id="pet-video" class="detail-section card-section"></section>
            <div id="pet-sections"></div>
            <section id="pet-curator" class="detail-section card-section"></section>
        </article>
    </main>

    <footer>
        <p>
            © <span id="footer-year">2026</span>
            <span data-i18n="footerRights">Сбор средств для уличных животных, Тбилиси.</span>
        </p>
        <p class="footer-sub">
            <a href="index.html" data-i18n="backToList">Ко всем подопечным</a>
        </p>
    </footer>

    <script src="config.js"></script>
    <script src="assets/i18n.js"></script>
    <script src="data/pets.js"></script>
    <script src="assets/db.js"></script>
    <script src="assets/ui.js"></script>
    <script src="assets/gallery.js"></script>
    <script src="assets/pet.js"></script>
</body>
</html>
